<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — لوحة الإدارة</title>
  <link rel="icon" href="https://waqfehsan.org.sa/wp-content/uploads/2025/09/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body data-page="login">
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <img src="https://waqfehsan.org.sa/wp-content/uploads/2025/09/logo.png" alt="" width="96" height="60" />
      <h1>لوحة الإدارة</h1>
      <p>سجّل الدخول للانتقال إلى الطلبات والعملاء</p>
      <label>اسم المستخدم
        <input id="username" name="username" autocomplete="username" required />
      </label>
      <label>كلمة المرور
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit">دخول</button>
      <a class="back" href="index.html">العودة للموقع</a>
    </form>
  </div>
  <script src="admin.js"></script>
</body>
</html>
